<section id="mentors" class="mentors-section">
  <div class="section">
    <span class="section-eyebrow reveal">Trusted guidance</span>
    <h2 class="section-title reveal">Meet Our Expert Mentors</h2>
    <p class="section-sub reveal">
      Our experienced counsellors help students choose the right university and career path through personalised guidance.
    </p>

    <div class="mentors-grid">
      {% for mentor in mentors %}
      <article class="mentor-card reveal reveal-stagger"
        <div class="mentor-media">
          <img
            src="{{ mentor.image }}"
            alt="{{ mentor.name }} portrait"
            class="mentor-image"
            loading="lazy">
          <span class="mentor-badge">{{ mentor.specialization }}</span>
        </div>

        <div class="mentor-body">
          <h3 class="mentor-name">{{ mentor.name }}</h3>

          <div class="mentor-meta">
            <div class="mentor-meta-item">
              <span class="mentor-meta-label">Students Guided</span>
              <span class="mentor-meta-value">{{ mentor.students_guided }}</span>
            </div>
          </div>

          <button
            type="button"
            class="mentor-btn"
            data-open-modal
            data-mentor="{{ mentor.name }}">
            Book Free Session
          </button>
        </div>
      </article>
      {% endfor %}
    </div>
  </div>
</section>
